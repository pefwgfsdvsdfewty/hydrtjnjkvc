<!DOCTYPE html>
<html>
<head>
<style>
body{
  text-align:center;
  font-family:Arial,sans-serif;
}

.size-btn{
  padding:10px 18px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#f2f2f2;
  cursor:pointer;
  transition:0.3s;
}

.size-btn:hover{
  background:black;
  color:white;
}

.price-box{
  margin-top:20px;
  display:inline-block;
  padding:15px 30px;
  background:black;
  color:white;
  border-radius:15px;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>
<body>

<h2>Pilih Ukuran</h2>

<button class="size-btn" onclick="ubahHarga('Rp200.000')">S</button>
<button class="size-btn" onclick="ubahHarga('Rp200.000')">M</button>
<button class="size-btn" onclick="ubahHarga('Rp200.000')">L</button>
<button class="size-btn" onclick="ubahHarga('Rp200.000')">XL</button>
<button class="size-btn" onclick="ubahHarga('Rp250.000')">XXL</button>
<button class="size-btn" onclick="ubahHarga('Rp250.000')">3XL</button>
<button class="size-btn" onclick="ubahHarga('Rp250.000')">4XL</button>

<div class="price-box" id="harga">
Rp200.000
</div>

<script>
function ubahHarga(harga){
  document.getElementById("harga").innerHTML = harga;
}
</script>

</body>
</html>
